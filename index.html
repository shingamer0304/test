<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Live User Server Tracker</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181c24;
            --panel-hover: #222834;
            --text-main: #ffffff;
            --text-muted: #8a96a8;
            --roblox-red: #ff3344;
            --status-online: #00e676;
            --status-playing: #00b0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 span {
            color: var(--roblox-red);
            font-weight: 800;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--roblox-red);
            box-shadow: 0 0 10px rgba(255, 51, 68, 0.2);
        }

        button {
            background-color: var(--roblox-red);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #e02233;
        }

        /* Result Section */
        .result-panel {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 20px;
            display: none; /* ซ่อนไว้ก่อนเสิร์ช */
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background-color: #2a313e;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--panel-bg);
        }

        .status-dot.playing { background-color: var(--status-playing); }
        .status-dot.online { background-color: var(--status-online); }

        .user-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .user-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Server & Game Detail */
        .game-status-box {
            background-color: var(--panel-hover);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .game-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--status-playing);
            margin-bottom: 5px;
        }

        .server-info {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .btn-join {
            display: block;
            text-align: center;
            background-color: #00c853;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-join:hover {
            background-color: #00b248;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .show {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <h2><span>ROBLOX</span> Server Tracker</h2>
    
    <div class="search-box">
        <input type="text" id="usernameInput" placeholder="ใส่ชื่อ User ใน Roblox ที่นี่...">
        <button onclick="trackUser()">ค้นหา</button>
    </div>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <div class="result-panel" id="resultPanel">
        <div class="user-profile">
            <div class="avatar-wrapper">
                <!-- ใช้รูป Placeholder จำลองรูปโปรไฟล์ Roblox -->
                <img src="https://images.rbxcdn.com/2bbb810057e60934789531649989679f.png" alt="User Avatar" class="avatar">
                <div class="status-dot playing"></div>
            </div>
            <div class="user-info">
                <h3 id="displayUsername">Player_Name</h3>
                <p id="userStatusText">กำลังเล่นเกมอยู่ (In-Game)</p>
            </div>
        </div>

        <div class="game-status-box">
            <div class="game-title" id="gameName">[UPD] Blox Fruits</div>
            <div class="server-info">
                <p><strong>Server ID:</strong> <span id="serverId">4a8b9c2d-1234-5678-90ab-cdef12345678</span></p>
                <p><strong>ผู้เล่นในเซิร์ฟเวอร์ขณะนี้:</strong> <span id="playerCount">11/12 คน</span></p>
                <p><strong>ปิงเซิร์ฟเวอร์ (Ping):</strong> 84 ms</p>
            </div>
        </div>

        <!-- ลิงก์ Deeplink สำหรับกดรันแอป Roblox เพื่อเข้าเซิร์ฟเวอร์ตามทันที -->
        <a href="roblox://experiences/start?placeId=275391513&gameInstanceId=4a8b9c2d-1234-5678-90ab-cdef12345678" class="btn-join" id="joinLink">
            กดเพื่อ Join Server ตามทันที
        </a>
    </div>
</div>

<script>
    function trackUser() {
        const username = document.getElementById('usernameInput').value.trim();
        if (username === "") {
            alert("กรุณาใส่ชื่อผู้ใช้ก่อนค้นหาครับ");
            return;
        }

        // ส่วนนี้จำลองการดึงข้อมูลสำเร็จ (Mock Data) 
        // ถ้าทำระบบจริง ข้อมูลตรงนี้จะถูกเปลี่ยนไปตามค่าที่ดึงมาจาก API หลังบ้าน
        document.getElementById('displayUsername').innerText = username;
        document.getElementById('gameName').innerText = "⚔️ [SEA 4] Blox Fruits";
        document.getElementById('serverId').innerText = "rbx-srv-" + Math.floor(Math.random() * 1000000);
        document.getElementById('playerCount').innerText = "9/12 คน";

        // แสดงผลหน้าต่างข้อมูล
        document.getElementById('resultPanel').classList.add('show');
    }
</script>

</body>
</html>
