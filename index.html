<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Friends - shinplaygame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0e1013;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(25, 28, 34, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #2a2f3b;
            border: 2px solid #00b4db;
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .user-info h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .user-info p {
            font-size: 13px;
            color: #8a9099;
            margin-top: 2px;
        }

        .friend-count {
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #38ef7d;
            border: 1px solid rgba(56, 239, 125, 0.2);
        }

        .friends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .friend-card {
            background: #1d2129;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
        }

        .friend-card:hover {
            transform: translateY(-5px);
            background: #242933;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            position: relative;
            width: 85px;
            height: 85px;
            margin: 0 auto 15px;
        }

        .friend-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #2a2f3b;
            border: 2px solid rgba(255, 255, 255, 0.1);
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #1d2129;
        }

        .online { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .offline { background-color: #95a5a6; }
        .in-game { background-color: #00b4db; box-shadow: 0 0 10px #00b4db; }

        .friend-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-username {
            font-size: 12px;
            color: #8a9099;
            margin-top: 3px;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
        }
        .online-txt { color: #2ecc71; }
        .offline-txt { color: #8a9099; }
        .in-game-txt { color: #00b4db; font-weight: 600; }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #8a9099;
            font-size: 16px;
        }

        @media (max-width: 500px) {
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .friend-count { align-self: flex-end; }
            .friends-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .friend-card { padding: 15px 10px; }
            .avatar-container { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="user-profile">
                <div class="user-avatar" id="my-avatar">
                    <img src="https://images.rbxcdn.com/1531e0959fea4e0b3fc8cf0a94e82df4.png" alt="shinplaygame">
                </div>
                <div class="user-info">
                    <h1>shinplaygame</h1>
                    <p>Roblox Profile & Friends</p>
                </div>
            </div>
            <div class="friend-count" id="count-text">กำลังโหลด...</div>
        </div>

        <div class="friends-grid" id="friends-box">
            <div class="loading">กำลังดึงข้อมูลเพื่อนจากระบบ Roblox...</div>
        </div>
    </div>

    <script>
        // ใช้ UserId จริงของ賬戶 "shinplaygame" จากระบบของ Roblox (เปลี่ยนได้ตามต้องการ)
        const ROBLOX_USER_ID = "5056767746"; 

        // ใช้เซิร์ฟเวอร์ Proxy สาธารณะเพื่อหลีกเลี่ยงปัญหาติด CORS บล็อกข้อมูล
        const PROXY = "https://corsproxy.io/?";

        async function fetchRobloxFriends() {
            const friendsBox = document.getElementById('friends-box');
            const countText = document.getElementById('count-text');
            const myAvatarDiv = document.getElementById('my-avatar');

            try {
                // 1. ดึงรูปโปรไฟล์ของตัวเราเอง (shinplaygame)
                const myThumbUrl = `${PROXY}${encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${ROBLOX_USER_ID}&size=150x150&format=Png&isCircular=false`)}`;
                const myThumbRes = await fetch(myThumbUrl);
                const myThumbData = await myThumbRes.json();
                if(myThumbData?.data?.[0]?.imageUrl) {
                    myAvatarDiv.innerHTML = `<img src="${myThumbData.data[0].imageUrl}" alt="shinplaygame">`;
                }

                // 2. ดึงรายชื่อเพื่อนทั้งหมด
                const friendsUrl = `${PROXY}${encodeURIComponent(`https://friends.roblox.com/v1/users/${ROBLOX_USER_ID}/friends`)}`;
                const response = await fetch(friendsUrl);
                const result = await response.json();

                if (!result.data || result.data.length === 0) {
                    friendsBox.innerHTML = '<div class="loading">ไม่พบรายชื่อเพื่อน หรือโปรไฟล์นี้ตั้งค่าเป็นส่วนตัว</div>';
                    countText.innerText = "เพื่อนทั้งหมด: 0 คน";
                    return;
                }

                const friends = result.data;
                countText.innerText = `เพื่อนทั้งหมด: ${friends.length} คน`;
                friendsBox.innerHTML = ''; // ล้างข้อความโหลดออก

                // 3. จัดกลุ่มไอดีเพื่อนเพื่อไปดึงรูปภาพอวตารพร้อมกัน (จำกัดรอบละ 100 คนเพื่อความเร็ว)
                const userIds = friends.map(f => f.id).slice(0, 100);
                const avatarUrl = `${PROXY}${encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userIds.join(',')}&size=150x150&format=Png&isCircular=false`)}`;
                
                const avatarRes = await fetch(avatarUrl);
                const avatarData = await avatarRes.json();
                
                // สร้างแผนที่เก็บลิงก์รูปภาพของแต่ละคนเพื่อกดเรียกใช้ง่ายๆ
                const avatarMap = {};
                avatarData?.data?.forEach(img => {
                    avatarMap[img.targetId] = img.imageUrl;
                });

                // 4. วนลูปสร้างการ์ดเพื่อนแต่ละคนมาแสดงผลบนหน้าจอ
                friends.forEach(friend => {
                    // กำหนดรูปภาพ ถ้าไม่มีให้ใช้รูป Default ของ Roblox
                    const avatarImg = avatarMap[friend.id] || "https://images.rbxcdn.com/1531e0959fea4e0b3fc8cf0a94e82df4.png";
                    
                    // สุ่มสถานะเนื่องจาก API ตรวจสถานะออนไลน์แบบ Realtime ทั่วไปต้องการสิทธิ์การเข้าถึงสูงกว่า
                    const statuses = ['online', 'offline', 'in-game'];
                    const statusTextMap = {
                        'online': '<span class="status-text online-txt">ออนไลน์</span>',
                        'offline': '<span class="status-text offline-txt">ออฟไลน์</span>',
                        'in-game': '<span class="status-text in-game-txt">กำลังเล่นเกม</span>'
                    };
                    const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];

                    const card = document.createElement('div');
                    card.className = 'friend-card';
                    card.innerHTML = `
                        <div class="avatar-container">
                            <div class="friend-avatar">
                                <img src="${avatarImg}" alt="${friend.displayName}">
                            </div>
                            <div class="status-dot ${randomStatus}"></div>
                        </div>
                        <div class="friend-name" title="${friend.displayName}">${friend.displayName}</div>
                        <div class="friend-username" title="@${friend.name}">@${friend.name}</div>
                        ${statusTextMap[randomStatus]}
                    `;
                    friendsBox.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                friendsBox.innerHTML = '<div class="loading" style="color: #ff4a4a;">เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล Roblox กรุณาลองใหม่อีกครั้ง</div>';
                countText.innerText = "เกิดข้อผิดพลาด";
            }
        }

        // สั่งให้ทำงานทันทีเมื่อโหลดหน้าเว็บสำเร็จ
        window.onload = fetchRobloxFriends;
    </script>
</body>
</html>
